services:
  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    command:
      - /bin/sh
      - -c
      - |
        redis-server \
          --requirepass "$${REDIS_PASSWORD:-password}" \
          --appendonly yes \
          --appendfsync everysec \
          --dir /data
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      RI_REDIS_DB: "0"
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    depends_on:
      - redis

  web:
    build:
      context: .
    environment:
      - MONGO_URL=mongodb://db:27017/db
      - OPENAI_API_KEY
      - DIGESTIFY_API_HOST=0.0.0.0
      - DIGESTIFY_API_JWKS_URL
      - DIGESTIFY_API_DEBUG
      - WEBQUEST_MCP_ACCESS_TOKEN
      - WEBQUEST_MCP_URL
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: serve
    profiles:
      - api
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./uv.lock

  mcp:
    image: mustafametesengul/webquest-mcp:latest
    environment:
      - WEBQUEST_MCP_AUTH_SECRET
      - WEBQUEST_MCP_AUTH_AUDIENCE=webquest-mcp
      - WEBQUEST_MCP_TRANSPORT=streamable-http
      - WEBQUEST_MCP_HOST=0.0.0.0
      - WEBQUEST_MCP_PORT=8001
      - HYPERBROWSER_API_KEY
      - OPENAI_API_KEY
    command: serve

  ngrok:
    image: ngrok/ngrok:latest
    command: http mcp:8001
    environment:
      - NGROK_AUTHTOKEN
    depends_on:
      - mcp
    ports:
      - "4040:4040"

volumes:
  redis_data:
