services:
  db:
    image: couchdb:latest
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5984/_up" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    environment:
      - COUCHDB_URL=http://db:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - OPENAI_API_KEY
      - DIGESTIFY_API_HOST=0.0.0.0
      - DIGESTIFY_API_JWKS_URL
      - DIGESTIFY_API_DEBUG
      - WEBQUEST_MCP_ACCESS_TOKEN
      - WEBQUEST_MCP_URL
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: serve
    profiles:
      - api
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./uv.lock

  mcp:
    image: mustafametesengul/webquest-mcp:latest
    environment:
      - WEBQUEST_MCP_AUTH_SECRET
      - WEBQUEST_MCP_AUTH_AUDIENCE=webquest-mcp
      - WEBQUEST_MCP_TRANSPORT=streamable-http
      - WEBQUEST_MCP_HOST=0.0.0.0
      - WEBQUEST_MCP_PORT=8001
      - HYPERBROWSER_API_KEY
      - OPENAI_API_KEY
    command: serve

  ngrok:
    image: ngrok/ngrok:latest
    command: http mcp:8001
    environment:
      - NGROK_AUTHTOKEN
    depends_on:
      - mcp
    ports:
      - "4040:4040"

volumes:
  couchdb_data:
