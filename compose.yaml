services:
  db:
    image: couchdb:latest
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "127.0.0.1:5984:5984" # Fauxton: http://localhost:5984/_utils/
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5984/_up" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    environment:
      - COUCHDB_URL=http://db:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - DIGESTIFY_API_HOST=0.0.0.0
      - DIGESTIFY_API_DATABASE=${DIGESTIFY_API_DATABASE:-digestify}
      - DIGESTIFY_API_SECRET_KEY=${DIGESTIFY_API_SECRET_KEY:-local-development-only-change-this-secret}
      - DIGESTIFY_API_EMAIL_BACKEND=${DIGESTIFY_API_EMAIL_BACKEND:-console}
      - RESEND_API_KEY
      - RESEND_FROM_ADDRESS
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: serve
    profiles:
      - api
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./uv.lock

  worker:
    build:
      context: .
    environment:
      - COUCHDB_URL=http://db:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - DIGESTIFY_API_DATABASE=${DIGESTIFY_API_DATABASE:-digestify}
      - DIGESTIFY_API_WORKER_INDEX=${DIGESTIFY_API_WORKER_INDEX:-0}
      - DIGESTIFY_API_WORKER_COUNT=${DIGESTIFY_API_WORKER_COUNT:-1}
      - DIGESTIFY_API_WORKER_CONCURRENCY=${DIGESTIFY_API_WORKER_CONCURRENCY:-10}
    depends_on:
      db:
        condition: service_healthy
    command: worker
    profiles:
      - api

  mcp:
    image: mustafametesengul/webquest-mcp:latest
    environment:
      - WEBQUEST_MCP_AUTH_SECRET
      - WEBQUEST_MCP_AUTH_AUDIENCE=webquest-mcp
      - WEBQUEST_MCP_TRANSPORT=streamable-http
      - WEBQUEST_MCP_HOST=0.0.0.0
      - WEBQUEST_MCP_PORT=8001
      - HYPERBROWSER_API_KEY
      - OPENAI_API_KEY
    command: serve

  ngrok:
    image: ngrok/ngrok:latest
    command: http mcp:8001
    environment:
      - NGROK_AUTHTOKEN
    depends_on:
      - mcp
    ports:
      - "4040:4040"

volumes:
  couchdb_data:
