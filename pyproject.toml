[project]
name = "digestify-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.3",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "openai>=2.14.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.45",
    "sqlmodel>=0.0.31",
]

[project.scripts]
digestify-api = "digestify_api.main:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mypy>=1.0.1",
    "ruff>=0.13.2",
]

[tool.pytest.ini_options]
markers = [
  "integration: slow / costly tests",
]
addopts = [
  "--mypy",
  "-m", "not integration",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
