[project]
name = "digestify-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=46.0.3",
    "digestify>=0.1.1",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "nats-py>=2.14.0",
    "openai>=2.14.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.10.1",
    "rillo[nats]>=0.2.6",
    "tzdata>=2025.3",
]

[project.scripts]
digestify-api = "digestify_api.app:run_app"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.40.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.1",
    "ty>=0.0.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.poe.tasks]
check = [
  { cmd = "ruff check" },
  { cmd = "ruff format --check" },
  { cmd = "ty check" }
]
format = [
  { cmd = "ruff check --select I --fix" },
  { cmd = "ruff format" }
]
test = [
  { cmd = "pytest" }
]
